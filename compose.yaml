# Demanda360 · 3 servicios: db (PostgreSQL), web (Flask) y n8n.
# Todos los puertos se atan a 127.0.0.1: nadie más en la red puede entrar.
# Uso: cp .env.example .env  →  editar .env  →  docker compose up -d --build
name: demanda360

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Bogota
    command: ["postgres", "-c", "timezone=America/Bogota"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo se ejecutan la PRIMERA vez (volumen vacío). Para recargar: docker compose down -v
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/alerta-stock-critico}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 8000 y no 5000: en macOS el 5000 lo ocupa AirPlay
      - "127.0.0.1:${WEB_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"          # solo porque es http en localhost
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  pgdata:     # conserva la base entre reinicios. NO es un respaldo (ver scripts/backup.sh)
  n8ndata:
